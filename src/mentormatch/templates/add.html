<!DOCTYPE html>
<html>

<head>
    <title>MentorMatch | Add Person</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>

<body class="min-h-screen bg-linear-45 from-purple-500 to-purple-200">
    {% with message = get_flashed_messages(with_categories=True) %}
    {% if message %}
    <div class="max-w-2xl mx-auto mb-4 p-4 rounded-lg {% if message[0][0] == 'error' %}bg-red-100 border border-red-400{% else %}bg-green-100 border border-green-400{% endif %}">
        {% if message[0][0] == "error" %}
        <strong class="text-red-700 font-bold"> Error: </strong>
        {% else %}
        <strong class="text-green-700 font-bold"> Success: </strong>
        {% endif %}
        <span class="{% if message[0][0] == 'error' %}text-red-700{% else %}text-green-700{% endif %}">{{message[0][1]}}</span>
    </div>
    {% endif %}
    {% endwith %}
    <div class="max-w-1/2 mx-auto mt-10 p-8">
    <h1 class="text-5xl font-thin tracking-wide text-center text-white my-2">Add Person</h1>
    <form action="/add" method="post" class="space-y-6">
        <div>
            <label for="name" class="block text-sm text-slate-100 mb-2">Full Name:</label>
            <input type="text" name="name" id="name" class="w-full px-4 py-2 border border-gray-300 text-slate-200 bg-slate-100/10 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        </div>

        <div>
            <label class="block text-sm text-slate-100 mb-3">Position:</label>
            <div class="flex justify-center gap-10">
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="radio" name="position" value="mentor" required checked class="w-4 h-4">
                    <span class="text-slate-100">Mentor</span>
                </label>
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="radio" name="position" value="mentee" required class="w-4 h-4 accent-fuchsia-500">
                    <span class="text-slate-100">Mentee</span>
                </label>
            </div>
        </div>

        <div>
            <label class="block text-sm text-slate-100 mb-2">Preferred Matches:</label>
            <div id="pillbox" class="flex flex-wrap gap-2 mb-3 p-3 border border-gray-300 bg-slate-100/10 rounded-lg min-h-[44px]"></div>
            <select id="matches" name="matches" multiple hidden>
                <optgroup label="mentors">
                    {% for mentor in mentors %}
                    <option value="{{ mentor.name }}" data-role="mentor">{{ mentor.name }}</option>
                    {% endfor %}
                </optgroup>
                <optgroup label="mentees">
                    {% for mentee in mentees %}
                    <option value="{{ mentee.name }}" data-role="mentee">{{ mentee.name }}</option>
                    {% endfor %}
                </optgroup>
            </select>
            <button type="button" id="matches-dropdown-trigger" class="w-full px-4 py-2 border border-gray-300 text-slate-200 bg-slate-100/10 rounded-lg focus:ring-2 focus:ring-indigo-500 hover:bg-slate-100/20 transition">
                + Add match
            </button>
        </div>

        <button type="submit" class="w-full bg-indigo-800 hover:bg-indigo-900 text-white font-semibold py-3 px-6 rounded-lg shadow-lg transition duration-200">Add Person</button>
    </form>

    <nav class="mt-6 text-center">
        <a href="/" class="text-slate-100 hover:text-slate-200">← Back to Home</a>
    </nav>
    </div>

</body>

</html>

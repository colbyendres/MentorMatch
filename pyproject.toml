[project]
name = "MentorMatch"
version = "1.0.0"
authors = [ {name = "Colby Endres", email="colby.endres2@gmail.com"} ]
description = "Graph-based mentor matching service"
dependencies = [
    "numpy<2.0.0",
    "psycopg2-binary",
    "flask",
    "authlib",
    "flask-sqlalchemy",
    "scipy",
    "gunicorn",
    "dotenv"
]
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-flask-sqlalchemy",
    "pytest-cov",
    "requests"
]

[build-system]
requires = ["uv_build >= 0.9.21, <0.10.0"]
build-backend = "uv_build"